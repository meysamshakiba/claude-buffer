[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    # queue_op() calls the lambda synchronously inside the same iteration, so
    # the late-bound loop variable is the value we want. Not a closure bug.
    "B023",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
